    <text x="70" y="240" font-size="76" font-weight="600">yoyo的旅行日记</text>
    <text x="74" y="304" font-size="34" opacity=".78">沿着知识去旅行，把走过的路写成地图。</text>
  </g>
  <g fill="#243a49" font-family="sans-serif" font-size="19" letter-spacing="3">
