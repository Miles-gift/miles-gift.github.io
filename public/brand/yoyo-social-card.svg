<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">yoyo的旅行日记</title>
  <desc id="desc">雾绿色手稿纸上，一条知识轨迹连接阅读、实验、记录与成长。</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f0e4"/>
      <stop offset=".55" stop-color="#edf4ef"/>
      <stop offset="1" stop-color="#e5eff0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#paper)"/>
  <circle cx="1025" cy="92" r="150" fill="#b8d0c0" opacity=".28" filter="url(#soft)"/>
  <circle cx="210" cy="610" r="180" fill="#c76c7b" opacity=".12" filter="url(#soft)"/>
  <path d="M72 455c128-106 214-126 340-62s214 47 314-37 166-76 397-16" fill="none" stroke="#5d8571" stroke-width="7" stroke-linecap="round" stroke-dasharray="3 20"/>
