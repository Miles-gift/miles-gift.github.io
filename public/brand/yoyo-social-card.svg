  <g fill="#edf4ef" stroke="#c44f67" stroke-width="5">
    <circle cx="72" cy="455" r="13"/><circle cx="412" cy="393" r="13"/><circle cx="726" cy="356" r="13"/><circle cx="1123" cy="340" r="13"/>
  </g>
  <g fill="#243a49" font-family="serif">
