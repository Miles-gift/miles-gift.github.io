<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">Miles 内容循环</title>
  <desc id="desc">从捕捉、验证、整理、发布到复盘的五步内容工作流</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#07080c"/><stop offset="0.55" stop-color="#11162d"/><stop offset="1" stop-color="#050506"/>
    </linearGradient>
    <linearGradient id="line" x1="0" x2="1"><stop stop-color="#2997ff"/><stop offset="1" stop-color="#9b6dff"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="28"/></filter>
  </defs>
  <rect width="1200" height="640" rx="52" fill="url(#bg)"/>
  <circle cx="230" cy="110" r="120" fill="#147ce5" opacity=".2" filter="url(#glow)"/>
  <circle cx="980" cy="520" r="140" fill="#8a5cff" opacity=".18" filter="url(#glow)"/>
  <path d="M176 320H1024" stroke="url(#line)" stroke-width="4" stroke-linecap="round" opacity=".7"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" text-anchor="middle">
    <g transform="translate(180 320)"><circle r="68" fill="#111827" stroke="#2997ff" stroke-width="3"/><text y="7" fill="#f5f5f7" font-size="30" font-weight="700">捕捉</text><text y="116" fill="#8e8e93" font-size="19">Capture</text></g>
    <g transform="translate(390 320)"><circle r="68" fill="#111827" stroke="#4b8fff" stroke-width="3"/><text y="7" fill="#f5f5f7" font-size="30" font-weight="700">验证</text><text y="116" fill="#8e8e93" font-size="19">Verify</text></g>
    <g transform="translate(600 320)"><circle r="78" fill="#17203c" stroke="#707cff" stroke-width="4"/><text y="7" fill="#f5f5f7" font-size="30" font-weight="700">整理</text><text y="126" fill="#8e8e93" font-size="19">Shape</text></g>
    <g transform="translate(810 320)"><circle r="68" fill="#17182b" stroke="#8b6cff" stroke-width="3"/><text y="7" fill="#f5f5f7" font-size="30" font-weight="700">发布</text><text y="116" fill="#8e8e93" font-size="19">Publish</text></g>
    <g transform="translate(1020 320)"><circle r="68" fill="#171525" stroke="#a663ff" stroke-width="3"/><text y="7" fill="#f5f5f7" font-size="30" font-weight="700">复盘</text><text y="116" fill="#8e8e93" font-size="19">Review</text></g>
    <text x="72" y="86" fill="#78b8ff" font-size="18" font-weight="700" letter-spacing="5" text-anchor="start">MILES · CONTENT LOOP</text>
    <text x="600" y="550" fill="#c7c7cc" font-size="22">不是一次性发布，而是可以反复修正的循环</text>
  </g>
</svg>
