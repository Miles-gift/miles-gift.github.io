<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">素材从私人空间进入公开网站前的边界</title>
  <desc id="desc">私人素材经过事实、隐私、版权三项检查，只有通过的原创表达进入公开网站。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f5f5f7"/>
      <stop offset="1" stop-color="#e8eef8"/>
    </linearGradient>
    <linearGradient id="gate" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#0071e3"/>
      <stop offset="1" stop-color="#7d5cff"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="620" rx="48" fill="url(#bg)"/>
  <text x="72" y="88" fill="#1d1d1f" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="27" font-weight="700">MILES · PUBLICATION BOUNDARY</text>
  <rect x="72" y="142" width="300" height="366" rx="32" fill="#fff" stroke="#d2d2d7"/>
  <text x="112" y="205" fill="#1d1d1f" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="34" font-weight="700">私人素材</text>
  <text x="112" y="264" fill="#6e6e73" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="24">课程 · 截图 · 证明</text>
  <text x="112" y="308" fill="#6e6e73" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="24">笔记 · 对话 · 实验</text>
  <path d="M112 368H330M112 410H282M112 452H315" stroke="#d2d2d7" stroke-width="10" stroke-linecap="round"/>
  <path d="M395 325H472" stroke="#86868b" stroke-width="3"/>
  <path d="m455 308 17 17-17 17" fill="none" stroke="#86868b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="492" y="112" width="218" height="426" rx="109" fill="url(#gate)"/>
  <circle cx="601" cy="216" r="58" fill="#fff" fill-opacity=".16" stroke="#fff" stroke-opacity=".44"/>
  <circle cx="601" cy="325" r="58" fill="#fff" fill-opacity=".16" stroke="#fff" stroke-opacity=".44"/>
  <circle cx="601" cy="434" r="58" fill="#fff" fill-opacity=".16" stroke="#fff" stroke-opacity=".44"/>
  <text x="601" y="224" text-anchor="middle" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="24" font-weight="700">事实</text>
  <text x="601" y="333" text-anchor="middle" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="24" font-weight="700">隐私</text>
  <text x="601" y="442" text-anchor="middle" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="24" font-weight="700">版权</text>
  <path d="M730 325H807" stroke="#86868b" stroke-width="3"/>
  <path d="m790 308 17 17-17 17" fill="none" stroke="#86868b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="827" y="142" width="301" height="366" rx="32" fill="#111216"/>
  <circle cx="878" cy="202" r="10" fill="#2997ff"/>
  <text x="908" y="213" fill="#f5f5f7" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="34" font-weight="700">公开作品</text>
  <text x="872" y="282" fill="#a1a1a6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="24">原创解释</text>
  <text x="872" y="329" fill="#a1a1a6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="24">来源链接</text>
  <text x="872" y="376" fill="#a1a1a6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="24">可维护结论</text>
