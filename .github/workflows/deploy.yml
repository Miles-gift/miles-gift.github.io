name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check
        run: npm run check
      - name: Test
        run: npm test
      - name: Check Frontmatter
        run: npm run frontmatter:check
      - name: Build
        run: npm run build
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  verify:
    name: Verify live site
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Check published pages and article URLs
        env:
          SITE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          set -euo pipefail
          check_url() {
            curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 10 --output /dev/null "$1"
          }
          for path in "" "blog/" "tags/" "about/" "rss.xml" "robots.txt" "sitemap-index.xml"; do
            check_url "${SITE_URL}${path}"
          done
          node --input-type=module > "$RUNNER_TEMP/published-slugs.txt" <<'NODE'
          import { readFile, readdir } from 'node:fs/promises';
          import path from 'node:path';

          const directory = 'src/content/blog';
          for (const name of (await readdir(directory)).filter((file) => /\.(md|mdx)$/i.test(file)).sort()) {
            const source = await readFile(path.join(directory, name), 'utf8');
            const match = source.match(/^---[ \t]*\r?\n([\s\S]*?)\r?\n---(?:\r?\n|$)/);
            if (!match) throw new Error(`${name} has no valid frontmatter`);
            const draft = match[1].match(/^draft\s*:\s*(true|false)\s*$/m);
            if (!draft) throw new Error(`${name} has no valid draft field`);
            if (draft[1] !== 'true') console.log(name.replace(/\.(md|mdx)$/i, ''));
          }
          NODE
          while IFS= read -r slug; do
            [ -n "$slug" ] || continue
            check_url "${SITE_URL}blog/${slug}/"
            legacy_page="$RUNNER_TEMP/legacy-page.html"
            curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 10 --output "$legacy_page" "${SITE_URL}articles/${slug}/"
            grep -qF 'http-equiv="refresh"' "$legacy_page"
          done < "$RUNNER_TEMP/published-slugs.txt"
