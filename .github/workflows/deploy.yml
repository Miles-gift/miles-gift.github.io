name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check
        run: npm run check
      - name: Test
        run: npm test
      - name: Check Frontmatter
        run: npm run frontmatter:check
      - name: Build
        run: npm run build
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  verify:
    name: Verify live site
    needs: deploy
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check published pages and migrated article URLs
        env:
          SITE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          set -euo pipefail
          for path in "" "blog/" "blog/site-start/" "blog/why-a-digital-garden/" "blog/content-operating-system/" "blog/public-not-private/" "tags/" "about/" "rss.xml" "robots.txt" "sitemap-index.xml"; do
            curl --fail --silent --show-error --retry 6 --retry-delay 10 "${SITE_URL}${path}" >/dev/null
          done
          for slug in site-start why-a-digital-garden content-operating-system public-not-private; do
            curl --fail --silent --show-error --retry 6 --retry-delay 10 "${SITE_URL}articles/${slug}/" | grep -q 'http-equiv="refresh"'
          done
