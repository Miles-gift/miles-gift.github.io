name: Content health

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/content-health.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'script/check-external-links.mjs'
      - 'script/content-health.mjs'
      - 'src/content/**'
  schedule:
    - cron: '30 0 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: content-health
  cancel-in-progress: true

jobs:
  audit:
    name: Audit content and links
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run local quality gate
        run: pnpm quality

      - name: Check content health
        run: pnpm content:health

      - name: Check published external links
        run: pnpm check:external
